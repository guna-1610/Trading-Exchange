<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exchange — Trading Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E17; --panel:#111826; --panel2:#0E1420; --raised:#161F30;
    --line:#1E2838; --line2:#28344a;
    --text:#E6EBF4; --muted:#8896AC; --faint:#57647C;
    --teal:#2DD4BF; --teal-dim:#1B8378;
    --bid:#3DDC97; --bid-bg:rgba(61,220,151,.11);
    --ask:#FF6B6B; --ask-bg:rgba(255,107,107,.11);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;font-weight:700}
  button,input,select{font-family:inherit}
  .hidden{display:none !important}

  /* ---------- auth screen ---------- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand .glyph{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal-dim));
    display:flex;align-items:center;justify-content:center;color:#04231F;font-weight:800;font-size:20px}
  .brand h1{font-size:19px;letter-spacing:-.01em}
  .brand p{margin:0;font-size:11px;color:var(--faint);font-family:"IBM Plex Mono"}
  .auth-sub{color:var(--muted);font-size:13px;margin:14px 0 20px}
  .seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:4px;margin-bottom:20px}
  .seg2 button{padding:9px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:700;
    cursor:pointer;font-size:13px}
  .seg2 button[aria-selected="true"]{background:var(--raised);color:var(--text)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .field input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line2);
    background:var(--panel2);color:var(--text);font-size:14px}
  .field input:focus{outline:none;border-color:var(--teal)}
  .primary{width:100%;padding:12px;border-radius:10px;border:0;font-weight:800;font-size:14.5px;cursor:pointer;
    background:var(--teal);color:#04231F;margin-top:2px}
  .primary:disabled{opacity:.6;cursor:default}
  .divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11px;margin:18px 0;
    text-transform:uppercase;letter-spacing:.08em}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  #gbtn{display:flex;justify-content:center;min-height:40px}
  .gnote{font-size:11.5px;color:var(--faint);text-align:center;line-height:1.5}
  .err{background:var(--ask-bg);border:1px solid var(--ask);color:#FFC9C9;border-radius:9px;padding:10px 12px;
    font-size:12.5px;margin-bottom:14px}
  .hint{font-size:11.5px;color:var(--faint);margin-top:14px;text-align:center;font-family:"IBM Plex Mono"}

  /* ---------- app ---------- */
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .logo{display:flex;align-items:center;gap:11px}
  .logo .glyph{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--teal-dim));
    display:flex;align-items:center;justify-content:center;color:#04231F;font-weight:800;font-size:17px}
  .logo h1{font-size:15.5px;letter-spacing:-.01em}
  .logo p{margin:0;font-size:11px;color:var(--faint);font-family:"IBM Plex Mono"}
  .tabs{display:flex;gap:4px;margin-left:10px}
  .tab{padding:7px 14px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--muted);
    cursor:pointer;font-weight:600;font-size:13px}
  .tab[aria-selected="true"]{background:var(--raised);color:var(--text);border-color:var(--line2)}
  .spacer{flex:1}
  .conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-family:"IBM Plex Mono"}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .conn.up .dot{background:var(--bid);box-shadow:0 0 8px var(--bid)}
  .conn.down .dot{background:var(--ask)}
  .who{display:flex;align-items:center;gap:10px;font-size:13px}
  .who .avatar{width:28px;height:28px;border-radius:50%;background:var(--raised);border:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--teal);font-size:13px}
  .who b{font-weight:700}
  .logout{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 11px;
    cursor:pointer;font-size:12px;font-weight:600}
  a.api{color:var(--teal);text-decoration:none;font-size:12px;font-family:"IBM Plex Mono"}

  .grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:14px;padding:16px 20px;max-width:1360px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .card .pad{padding:14px 16px}

  .ob{padding:6px 10px 12px}
  .ob-row{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:3px 8px;border-radius:5px;font-size:13px;z-index:1}
  .ob-row .depth{position:absolute;top:0;bottom:0;right:0;border-radius:5px;z-index:-1}
  .ob-row.ask .depth{background:var(--ask-bg)} .ob-row.bid .depth{background:var(--bid-bg)}
  .ob-row .px{font-weight:600} .ob-row.ask .px{color:var(--ask)} .ob-row.bid .px{color:var(--bid)}
  .ob-row .qty,.ob-row .tot{text-align:right;color:var(--muted)}
  .ob-head{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:2px 18px 8px;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
  .ob-head span:not(:first-child){text-align:right}
  .spread{display:flex;justify-content:space-between;align-items:center;padding:9px 18px;margin:5px 8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px}
  .spread .last{font-size:19px;font-weight:600}
  .spread .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}

  .tape{max-height:520px;overflow:auto}
  .tape table{width:100%;border-collapse:collapse;font-size:13px}
  .tape th{position:sticky;top:0;background:var(--panel);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--faint);text-align:right;padding:8px 16px;font-weight:600}
  .tape th:first-child{text-align:left}
  .tape td{padding:5px 16px;text-align:right;border-bottom:1px solid var(--panel2)}
  .tape td:first-child{text-align:left;color:var(--muted)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .seg button{padding:9px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);
    font-weight:700;cursor:pointer;font-size:13px}
  .seg button.buy[aria-pressed="true"]{background:var(--bid-bg);color:var(--bid);border-color:var(--bid)}
  .seg button.sell[aria-pressed="true"]{background:var(--ask-bg);color:var(--ask);border-color:var(--ask)}
  .typerow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .place{width:100%;padding:12px;border-radius:9px;border:0;font-weight:800;font-size:14.5px;cursor:pointer;margin-top:4px;
    background:var(--teal);color:#04231F}
  .place.sell{background:var(--ask);color:#2A0A0A} .place.buy{background:var(--bid);color:#052B1C}
  .bal{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--panel2);font-size:13px}
  .bal .a{color:var(--muted)} .bal .v{font-weight:600} .bal .r{color:var(--faint);font-size:11.5px}
  .faucet{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:7px;padding:4px 9px;
    cursor:pointer;font-size:11px;font-weight:600}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--raised);
    border:1px solid var(--line2);border-radius:10px;padding:11px 18px;font-size:13px;opacity:0;transition:opacity .25s;
    pointer-events:none;z-index:50;max-width:520px}
  .toast.show{opacity:1} .toast.err{border-color:var(--ask);color:#FFC9C9} .toast.ok{border-color:var(--bid)}
  @media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ==================== AUTH SCREEN ==================== -->
<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="brand">
      <div class="glyph">&#8817;</div>
      <div><h1>Exchange</h1><p>spring-boot matching engine</p></div>
    </div>
    <div class="auth-sub">Sign in to trade on the exchange.</div>

    <div class="seg2" id="authTabs">
      <button data-mode="login" aria-selected="true" onclick="setMode('login')">Log in</button>
      <button data-mode="register" aria-selected="false" onclick="setMode('register')">Register</button>
    </div>

    <div class="err hidden" id="authErr"></div>

    <div class="field"><label>Username</label><input id="username" autocomplete="username" placeholder="e.g. trader_jane"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="field hidden" id="emailField"><label>Email (optional)</label><input id="email" type="email" placeholder="you@example.com"></div>

    <button class="primary" id="authBtn" onclick="submitAuth()">Log in</button>

    <div id="googleBlock">
      <div class="divider">or</div>
      <div id="gbtn"></div>
      <div class="gnote hidden" id="gNote"></div>
    </div>

    <div class="hint" id="demoHint">demo / password123</div>
  </div>
</div>

<!-- ==================== APP SCREEN ==================== -->
<div id="appScreen" class="hidden">
  <header>
    <div class="logo">
      <div class="glyph">&#8817;</div>
      <div><h1>Exchange</h1><p>spring-boot matching engine</p></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <a class="api" href="/swagger-ui.html" target="_blank">REST API &#8599;</a>
    <div class="conn down" id="conn"><span class="dot"></span><span id="connText">connecting</span></div>
    <div class="who">
      <div class="avatar" id="avatar">?</div>
      <span>@<b id="whoName">—</b></span>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h3>Order Book &middot; <span id="obSym">BTC-USD</span></h3>
      <div class="ob-head"><span>Price</span><span>Size</span><span>Total</span></div>
      <div class="ob" id="asks"></div>
      <div class="spread">
        <div><div class="lbl">Last</div><div class="last mono" id="lastPx">—</div></div>
        <div style="text-align:right"><div class="lbl">Spread</div><div class="last mono" id="spread" style="font-size:15px">—</div></div>
      </div>
      <div class="ob" id="bids"></div>
    </div>

    <div class="card">
      <h3>Trades</h3>
      <div class="tape">
        <table><thead><tr><th>Time</th><th>Price</th><th>Size</th><th>Side</th></tr></thead>
          <tbody id="tape"></tbody></table>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:14px">
        <h3>Order Ticket</h3>
        <div class="pad">
          <div class="seg">
            <button class="buy" data-side="BUY" aria-pressed="true" onclick="setSide('BUY')">Buy</button>
            <button class="sell" data-side="SELL" aria-pressed="false" onclick="setSide('SELL')">Sell</button>
          </div>
          <div class="typerow">
            <div class="field"><label>Type</label>
              <select id="type" onchange="onType()"><option value="LIMIT">Limit</option><option value="MARKET">Market</option></select></div>
            <div class="field"><label>Price</label><input id="price" class="mono" type="number" value="30000"></div>
          </div>
          <div class="field"><label>Quantity</label><input id="qty" class="mono" type="number" value="1"></div>
          <button class="place buy" id="placeBtn" onclick="place()">Buy BTC-USD</button>
        </div>
      </div>
      <div class="card">
        <h3>Balances &middot; <span id="balAcct">—</span>
          <span><button class="faucet" onclick="faucet('USD',1000000)">+1M USD</button>
                <button class="faucet" onclick="faucet('BTC',10)">+10 BTC</button></span></h3>
        <div class="pad" id="balances"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $ = s => document.querySelector(s);
const fmt = n => n==null ? "—" : Number(n).toLocaleString();
let TOKEN = localStorage.getItem("ex_token") || null;
let ME = null, SYMBOL="BTC-USD", SIDE="BUY", INSTRUMENTS=[], CONFIG={googleEnabled:false};

// ---------- fetch helper with auth ----------
async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers||{});
  if(opts.body) headers["Content-Type"]="application/json";
  if(TOKEN) headers["Authorization"]="Bearer "+TOKEN;
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if(r.status===401){ doLogout(); throw new Error("unauthorized"); }
  return r;
}

// ---------- auth screen ----------
let MODE="login";
function setMode(m){
  MODE=m;
  document.querySelectorAll("#authTabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.mode===m));
  $("#emailField").classList.toggle("hidden", m!=="register");
  $("#authBtn").textContent = m==="login" ? "Log in" : "Create account";
  $("#password").setAttribute("autocomplete", m==="login"?"current-password":"new-password");
  hideErr();
}
function showErr(msg){ const e=$("#authErr"); e.textContent=msg; e.classList.remove("hidden"); }
function hideErr(){ $("#authErr").classList.add("hidden"); }

async function submitAuth(){
  hideErr();
  const username=$("#username").value.trim(), password=$("#password").value;
  if(!username||!password){ showErr("Username and password are required."); return; }
  const btn=$("#authBtn"); btn.disabled=true;
  try{
    const path = MODE==="login" ? "/api/auth/login" : "/api/auth/register";
    const body = MODE==="login" ? {username,password}
                                 : {username,password,email:$("#email").value.trim()||null};
    const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ showErr(j.message || "Authentication failed."); return; }
    onAuthed(j.token);
  }catch(e){ showErr("Could not reach the server."); }
  finally{ btn.disabled=false; }
}

// ---------- google ----------
function handleGoogle(resp){
  fetch("/api/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({credential:resp.credential})})
  .then(r=>r.json().then(j=>({ok:r.ok,j})))
  .then(({ok,j})=>{ if(ok) onAuthed(j.token); else showErr(j.message||"Google sign-in failed."); })
  .catch(()=>showErr("Google sign-in failed."));
}
function initGoogle(){
  if(!CONFIG.googleEnabled){
    $("#gbtn").classList.add("hidden");
    const n=$("#gNote"); n.classList.remove("hidden");
    n.textContent="Google sign-in is not configured. Set GOOGLE_CLIENT_ID on the server to enable it.";
    return;
  }
  if(!window.google || !google.accounts){ setTimeout(initGoogle,300); return; }
  google.accounts.id.initialize({client_id:CONFIG.googleClientId, callback:handleGoogle});
  google.accounts.id.renderButton($("#gbtn"),{theme:"filled_black",size:"large",width:344,text:"continue_with"});
}

// ---------- session ----------
async function onAuthed(token){
  TOKEN=token; localStorage.setItem("ex_token",token);
  await enterApp();
}
function logout(){ doLogout(); }
function doLogout(){
  TOKEN=null; ME=null; localStorage.removeItem("ex_token");
  if(ws){ try{ws.close();}catch(e){} }
  $("#appScreen").classList.add("hidden"); $("#authScreen").classList.remove("hidden");
}

async function bootConfig(){
  try{ CONFIG = await (await fetch("/api/auth/config")).json(); }catch(e){ CONFIG={googleEnabled:false}; }
  initGoogle();
}

async function enterApp(){
  // validate token / load identity
  try{
    const r = await api("/api/auth/me");
    if(!r.ok) throw new Error();
    ME = await r.json();
  }catch(e){ doLogout(); return; }
  $("#authScreen").classList.add("hidden"); $("#appScreen").classList.remove("hidden");
  $("#whoName").textContent = ME.username;
  $("#avatar").textContent = ME.username.charAt(0).toUpperCase();
  $("#balAcct").textContent = ME.accountId;
  await loadInstruments();
  await refreshAll();
  connectWs();
}

// ---------- market data ----------
async function loadInstruments(){
  INSTRUMENTS = await (await fetch("/api/market/instruments")).json();
  const tabs=$("#tabs"); tabs.innerHTML="";
  INSTRUMENTS.forEach(i=>{const b=document.createElement("button");b.className="tab";b.textContent=i.symbol;
    b.setAttribute("aria-selected", i.symbol===SYMBOL);
    b.onclick=()=>{SYMBOL=i.symbol;[...tabs.children].forEach(t=>t.setAttribute("aria-selected",t.textContent===SYMBOL));
      $("#obSym").textContent=SYMBOL; refreshAll();};
    tabs.appendChild(b);});
}
async function refreshAll(){ await Promise.all([refreshBook(), refreshTrades(), refreshBalances()]); }

async function refreshBook(){ renderBook(await (await fetch(`/api/market/${SYMBOL}/book?levels=8`)).json()); }
function cum(levels){let s=0;return levels.map(l=>s+=l.quantity);}
function renderBook(b){
  const maxTot=Math.max(cum(b.asks).slice(-1)[0]||1, cum(b.bids).slice(-1)[0]||1);
  const ac=cum(b.asks); $("#asks").innerHTML=b.asks.map((l,i)=>row(l,"ask",ac[i],maxTot)).reverse().join("");
  const bc=cum(b.bids); $("#bids").innerHTML=b.bids.map((l,i)=>row(l,"bid",bc[i],maxTot)).join("");
  $("#spread").textContent=b.spread==null?"—":fmt(b.spread);
}
function row(l,side,tot,maxTot){
  const w=Math.max(3,Math.round(100*tot/maxTot));
  return `<div class="ob-row ${side}"><div class="depth" style="width:${w}%"></div>`
    +`<div class="px mono">${fmt(l.price)}</div><div class="qty mono">${fmt(l.quantity)}</div>`
    +`<div class="tot mono">${fmt(tot)}</div></div>`;
}
async function refreshTrades(){ renderTrades(await (await fetch(`/api/market/${SYMBOL}/trades?limit=40`)).json()); }
function renderTrades(trades){
  $("#tape").innerHTML=trades.map(t=>{
    const time=new Date(t.timestamp).toLocaleTimeString('en-GB');
    const c=t.takerSide==="BUY"?"var(--bid)":"var(--ask)";
    return `<tr><td class="mono">${time}</td><td class="mono" style="color:${c}">${fmt(t.price)}</td>`
      +`<td class="mono">${fmt(t.quantity)}</td><td class="mono" style="color:${c}">${t.takerSide}</td></tr>`;
  }).join("");
  if(trades[0]) $("#lastPx").textContent=fmt(trades[0].price);
}
async function refreshBalances(){
  try{
    const r=await api("/api/auth/me"); if(!r.ok) return;
    ME=await r.json();
    $("#balances").innerHTML = ME.balances && ME.balances.length ? ME.balances.map(b=>
      `<div class="bal"><span class="a">${b.asset}</span><span><span class="v mono">${fmt(b.available)}</span> `
      +`<span class="r mono">${b.reserved>0?("+"+fmt(b.reserved)+" reserved"):""}</span></span></div>`).join("")
      : '<div class="r">no balances</div>';
  }catch(e){}
}

// ---------- trading ----------
function setSide(s){ SIDE=s;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.side===s));
  const btn=$("#placeBtn"); btn.className="place "+(s==="BUY"?"buy":"sell");
  btn.textContent=(s==="BUY"?"Buy ":"Sell ")+SYMBOL;
}
function onType(){ $("#price").disabled = $("#type").value==="MARKET"; }
async function place(){
  const body={symbol:SYMBOL, side:SIDE, type:$("#type").value,
    price:$("#type").value==="MARKET"?0:Number($("#price").value), quantity:Number($("#qty").value)};
  try{
    const r=await api("/api/orders",{method:"POST",body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){ toast(j.message||"order rejected","err"); return; }
    const o=j.order, n=j.trades.length;
    toast(`${o.side} ${o.originalQty} ${SYMBOL} · ${o.status}`+(n?` · ${n} fill${n>1?"s":""}`:""),"ok");
    await refreshAll();
  }catch(e){}
}
async function faucet(asset,amount){
  try{
    const r=await api(`/api/accounts/${ME.accountId}/deposits`,{method:"POST",body:JSON.stringify({asset,amount})});
    if(r.ok){ toast(`Deposited ${fmt(amount)} ${asset}`,"ok"); refreshBalances(); }
  }catch(e){}
}

// ---------- websocket ----------
let ws;
function connectWs(){
  const proto=location.protocol==="https:"?"wss":"ws";
  const url=(location.host?`${proto}://${location.host}`:"ws://localhost:8080")+"/ws/market";
  ws=new WebSocket(url);
  ws.onopen=()=>{ $("#conn").className="conn up"; $("#connText").textContent="live"; };
  ws.onclose=()=>{ $("#conn").className="conn down"; $("#connText").textContent="disconnected";
    if(TOKEN) setTimeout(connectWs,2000); };
  ws.onmessage=ev=>{ const m=JSON.parse(ev.data);
    if(m.topic==="book" && m.data.symbol===SYMBOL) renderBook(m.data);
    else if(m.topic==="trade" && m.data.symbol===SYMBOL){ refreshTrades(); refreshBalances(); } };
}

let toastT;
function toast(msg,kind){ const t=$("#toast"); t.textContent=msg; t.className="toast show "+(kind||"");
  clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2600); }

// ---------- start ----------
setSide("BUY"); setMode("login"); bootConfig();
if(TOKEN){ enterApp(); }
</script>
</body>
</html>
